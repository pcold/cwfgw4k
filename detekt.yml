# Provided by :detekt-rules, not by detekt itself. detekt rejects a config section naming a
# ruleset it did not load, so this block is also the check that the module reached the
# `detektPlugins` classpath of whichever module is being analyzed.
cwfgw:
  KDocLength:
    active: true
    # Production only: the sweeps that brought KDoc under budget never reached tests.
    excludes: ['**/src/test/**']
  UnsafeMessageInterpolation:
    active: true
    # Production only: a spec's message is read by the person whose spec failed, off a fixture they wrote.
    excludes: ['**/src/test/**']

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
    # IO is left out: src/CLAUDE.md → Concurrency hardcodes withContext(Dispatchers.IO) around blocking
    # calls, and Transactor's limitedParallelism must equal the pool size, which an injected dispatcher breaks.
    dispatcherNames: ['Default', 'Unconfined']
  RedundantSuspendModifier:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - NullPointerException
      - IndexOutOfBoundsException
      - RuntimeException
      - Throwable
  TooGenericExceptionThrown:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  VarCouldBeVal:
    active: true
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'org.springframework.**'
        reason: 'Spring is excluded by CLAUDE.md — use Ktor.'
      - value: 'com.fasterxml.jackson.**'
        reason: 'Jackson is excluded by CLAUDE.md — use kotlinx.serialization.'
      - value: 'arrow.**'
        reason: 'Arrow is excluded by CLAUDE.md without explicit discussion.'
      - value: 'javax.persistence.**'
        reason: 'JPA is excluded by CLAUDE.md — use jOOQ.'
      - value: 'jakarta.persistence.**'
        reason: 'JPA is excluded by CLAUDE.md — use jOOQ.'
  ForbiddenMethodCall:
    active: true
    # Production only: in a spec, `.single()` over an empty collection throwing is the assertion failure.
    excludes: ['**/src/test/**']
    methods:
      - value: 'kotlinx.coroutines.runBlocking'
        reason: 'runBlocking is forbidden outside main entrypoints and tests (CLAUDE.md).'
      - value: 'org.jooq.DSLContext.transactionResult'
        reason: 'Transactions are opened only by com.cwfgw.db.Transactor, on its pool-sized dispatcher (src/CLAUDE.md → jOOQ).'
      - value: 'org.jooq.DSLContext.transaction'
        reason: 'Transactions are opened only by com.cwfgw.db.Transactor, on its pool-sized dispatcher (src/CLAUDE.md → jOOQ).'
      - value: 'org.jooq.DSLContext.transactionAsync'
        reason: 'Transactions are opened only by com.cwfgw.db.Transactor, on its pool-sized dispatcher (src/CLAUDE.md → jOOQ).'
      - value: 'org.jooq.DSLContext.transactionResultAsync'
        reason: 'Transactions are opened only by com.cwfgw.db.Transactor, on its pool-sized dispatcher (src/CLAUDE.md → jOOQ).'
      - value: 'org.jooq.DSLContext.transactionPublisher'
        reason: 'Transactions are opened only by com.cwfgw.db.Transactor, on its pool-sized dispatcher (src/CLAUDE.md → jOOQ).'
      - value: 'org.jooq.DSLContext.startTransaction'
        reason: 'Transactions are opened only by com.cwfgw.db.Transactor, on its pool-sized dispatcher (src/CLAUDE.md → jOOQ).'
      - value: 'kotlin.collections.single'
        reason: 'Take the one element only from a collection whose size the reader can see proven; suppress at the declaration where it is, use singleOrNull where it is not (src/CLAUDE.md → Collections).'
      - value: 'kotlin.collections.first'
        reason: 'Take the head only from a collection whose size the reader can see proven; suppress at the declaration where it is, use firstOrNull where it is not (src/CLAUDE.md → Collections).'
  AbstractClassCanBeConcreteClass:
    active: true
  AbstractClassCanBeInterface:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedVariable:
    active: true
  UseCheckNotNull:
    active: true
  UseCheckOrError:
    active: true
  UseOrEmpty:
    active: true
  UseRequire:
    active: true
  UseRequireNotNull:
    active: true

potential-bugs:
  IgnoredReturnValue:
    active: true
    # The rule's returnValueTypes include kotlin.Function*, so shouldNotBeNull on a function-typed
    # subject reads as a produced function nothing consumes.
    ignoreFunctionCall: ['io.kotest.matchers.nulls.shouldNotBeNull']
  ImplicitDefaultLocale:
    active: true
  UnsafeCallOnNullableType:
    active: true
    # Emptied rather than inherited: the default carves out tests, and a `!!` in a spec is a review finding too.
    excludes: []
  UnsafeCast:
    active: true

performance:
  SpreadOperator:
    active: true
    # Production only: a test does not pay the per-call array copy twice.
    excludes: ['**/src/test/**']

naming:
  NoNameShadowing:
    active: true

complexity:
  # A Kotest spec's tests are all arguments to its superclass constructor, so on a spec this rule measures
  # the file, not a class.
  LargeClass:
    excludes: ['**/src/test/**']
  LongMethod:
    active: true
    allowedLines: 50
  # Calibrated for a repository insert's one-parameter-per-column, and a service's
  # one-constructor-parameter-per-repository under Cross-repo flows. Exceptions are suppressed at the declaration.
  LongParameterList:
    active: true
    excludes: ['**/src/test/**']
    allowedFunctionParameters: 11
    allowedConstructorParameters: 9
  TooManyFunctions:
    active: false
