http:
  host: 0.0.0.0
  port: ${HTTP_PORT:-8080}

db:
  jdbcUrl: ${DB_JDBC_URL:-jdbc:postgresql://localhost:5432/cwfgw4k}
  user: ${DB_USER:-cwfgw4k}
  password: ${DB_PASSWORD:-cwfgw4k}
  schema: ${DB_SCHEMA:-cwfgw4k}
  maxPoolSize: ${DB_POOL:-10}

auth:
  # HMAC key used to sign session cookies. MUST be exported at startup; the app refuses to boot
  # with a blank value. Generate with: openssl rand -hex 32
  sessionSecret: ${AUTH_SESSION_SECRET:-}
  sessionMaxAgeSeconds: ${AUTH_SESSION_MAX_AGE:-86400}
  # If both adminUsername and adminPassword are set AND the users table is empty at startup, an admin
  # user is seeded with these credentials. Setting only one refuses to boot; setting neither makes the
  # seeder log a warning and skip — we never bake in a default password.
  adminUsername: ${AUTH_ADMIN_USERNAME:-}
  adminPassword: ${AUTH_ADMIN_PASSWORD:-}
  # Mark the session cookie `Secure` so browsers only ever send it over HTTPS.
  # Default true = prod-safe. Local development against http://localhost:8080
  # needs AUTH_COOKIE_SECURE=false because Secure cookies aren't accepted on
  # plain-HTTP origins.
  cookieSecure: ${AUTH_COOKIE_SECURE:-true}

loginThrottle:
  # Once maxFailures logins have failed inside the trailing window, for one username or one client address,
  # the next is answered 429 without checking the password. Counted per instance, so N instances allow N times
  # this. A success clears the username's count, never the address's.
  maxFailures: ${LOGIN_THROTTLE_MAX_FAILURES:-5}
  windowSeconds: ${LOGIN_THROTTLE_WINDOW_SECONDS:-900}

cache:
  # Default TTL for cached GET responses. Routes can pass per-call overrides.
  # Start at 5 minutes; tune up if upstream load is still high, down if liveness
  # complaints come in.
  defaultTtlSeconds: ${CACHE_DEFAULT_TTL_SECONDS:-300}
  # Least time between two request-run sweeps of expired rows. Default matches
  # TTL: under traffic the table holds about one TTL window of stale rows.
  sweepIntervalSeconds: ${CACHE_SWEEP_INTERVAL_SECONDS:-300}
  # Joins every cache key, so one revision never serves a body another encoded.
  # Cloud Run sets K_REVISION on each revision. Left blank anywhere else, the key
  # takes a hash of the build's code instead (CacheConfig.revision).
  deployRevision: ${K_REVISION:-}

espn:
  # In-process Caffeine cache for ESPN scoreboard responses keyed by date.
  # A live=true report reads through no other cache, so this TTL is how far
  # live data can trail ESPN.
  scoreboardCacheTtlSeconds: ${ESPN_SCOREBOARD_CACHE_TTL_SECONDS:-60}
  scoreboardCacheMaxSize: ${ESPN_SCOREBOARD_CACHE_MAX_SIZE:-256}

debug:
  # Diagnostic endpoints (thread + coroutine dump). Off by default — only
  # ops/load-test/cold-burst.sh's staging deploys flip this on. Enabling
  # also installs kotlinx.coroutines.debug.DebugProbes, which has
  # measurable per-launch overhead, so leaving it off in prod is
  # intentional.
  enabled: ${DEBUG_ENDPOINTS_ENABLED:-false}
