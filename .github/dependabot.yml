version: 2

# Majors stay ungrouped: each tends to need its own attention, while minor and patch
# bumps land as one PR per ecosystem.
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    groups:
      # Ahead of npm-minor-patch (first match wins) and takes majors too: the @vitest/*
      # packages peer on the exact vitest version, so none resolves bumped alone. Enumerated
      # because a scoped wildcard (`@vitest/*`) silently matches nothing.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
          - "@vitest/ui"
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
